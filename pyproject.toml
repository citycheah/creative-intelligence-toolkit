[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-intelligence-toolkit"
version = "0.1.0"
description = "Modular multi-platform digital ad discovery, scraping, Gemini multimodal AI analysis, and alerting pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Cheah Chuen Thong"}
]
keywords = [
    "scraping",
    "ad-intelligence",
    "gemini",
    "multimodal",
    "playwright",
    "yt-dlp",
    "apify",
    "social-media",
    "marketing-analytics"
]
dependencies = [
    "google-genai>=0.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "playwright-stealth>=0.1.6",
    "httpx>=0.25.0",
    "yt-dlp>=2023.11.16",
    "python-dotenv>=1.0.0",
    "apify-client>=1.6.0",
    "feedparser>=6.0.10",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "social_asset_downloader*",
    "creative_ai_analyzer*",
    "social_intel_sources*",
    "data_sinks*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
